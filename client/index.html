<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FootEra</title>

    <!-- Cor da barra do navegador (Android) -->
    <meta name="theme-color" content="#169c36" />

    <!-- Compartilhamento / Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="FootEra" />
    <meta
      property="og:description"
      content="A plataforma de quem vive futebol."
    />
    <meta property="og:url" content="https://footera.app.br/" />
    <meta
      property="og:image"
      content="https://footera.app.br/footera-share.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FootEra" />
    <meta
      name="twitter:description"
      content="A plataforma de quem vive futebol."
    />
    <meta
      name="twitter:image"
      content="https://footera.app.br/footera-share.png"
    />

    <!-- Favicons (coloque os arquivos em client/public/) -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="/icon-32.png" sizes="32x32">
    <link rel="icon" type="image/png" href="/icon-16.png" sizes="16x16">
    <link rel="apple-touch-icon" href="/icon-180.png">

    <!-- PWA (o vite-plugin-pwa injeta o registerSW no build) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>

  <body>
    <div id="root"></div>

    <!-- Entrada do app (ajuste se seu arquivo estiver em outro caminho) -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
